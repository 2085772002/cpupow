    <title>sysfs 轻调度</title>
    <script>
    /* 说明：主题引导（v2.5.4）。
       问题：组件样式里的深色规则全部挂在 html.dark 上（例如 .dark .cpu-config、
       .dark .cp-boot、.dark .mode-save），但页面从来没有给 html 加过 dark 类——
       这些规则一直是死代码，于是系统深色模式下只有 Tailwind 的 media 变体生效，
       配置页（全用 .cpu-* 变量）、启动页、模式徽章、图标遮罩仍然一片浅色。
       做法：首帧前按系统偏好同步一次 html.dark，并监听偏好变化；
       同时写 color-scheme，让原生滚动条、下拉框、数字输入框跟随主题。 */
    (function () {
        var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        function apply(dark) {
            var root = document.documentElement;
            if (!root) return;
            if (dark) root.classList.add('dark');
            else root.classList.remove('dark');
            try { root.style.colorScheme = dark ? 'dark' : 'light'; } catch (e) {}
        }
        apply(!!(mq && mq.matches));
        if (mq) {
            if (mq.addEventListener) mq.addEventListener('change', function (e) { apply(!!e.matches); });
            else if (mq.addListener) mq.addListener(function (e) { apply(!!e.matches); });
        }
    })();
    </script>
    <script>
        /* 分级错误机制（v1.20.1 bug修复，需求：技术细节不暴露给用户）：
       1) 资源加载失败（img/script/link 等非阻断）→ 仅记 __errs 后台日志，不上横幅；
          img 自动替换为通用占位图标（静默降级，全程无提示）。
       2) JS 运行时错误/unhandledrejection（可能影响核心功能）→ 横幅提示，
          但只用通俗文案，不输出代码、链接、文件名等技术信息。
       3) console.error → 仅记日志。 */
    window.__errs = [];
    function __log(msg) {
        try { window.__errs.push(String(msg).slice(0, 1500)); } catch (e) {}
    }
    /* 图片占位图标：灰底圆角方块 + 通用图片符号（SVG data URI） */
    var __IMG_PH = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">' +
        '<rect width="40" height="40" rx="10" fill="#cbd5e1"/>' +
        '<circle cx="15" cy="16" r="3.5" fill="#94a3b8"/>' +
        '<path d="M8 30l8-9 6 6 4-4 6 7z" fill="#94a3b8"/></svg>');
    function __showFatal() {
        try {
            var d = document.getElementById('__errbar');
            if (!d) {
                d = document.createElement('div');
                d.id = '__errbar';
                d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#dc2626;color:#fff;font:12px/1.6 sans-serif;padding:8px 12px;text-align:center;';
                if (document.body) document.body.appendChild(d);
                else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
            }
            d.textContent = '页面运行出错，已记录详情；请刷新页面重试';
        } catch (e) {}
    }
    window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && t.tagName) {
            var tag = t.tagName.toLowerCase();
            if (tag === 'img') {
                /* 图片加载失败：静默降级占位图标，仅后台记录 */
                __log('img fallback: ' + (t.src || ''));
                if (!t.getAttribute('data-ph')) {
                    t.setAttribute('data-ph', '1');
                    t.src = __IMG_PH;
                }
                return;
            }
            if (t.src || t.href) {
                /* script/css/link 等资源失败：非阻断，仅后台记录不上横幅 */
                __log('resource failed: <' + tag + '> ' + (t.src || t.href));
                return;
            }
        }
        __log('js error: ' + (e.message || 'error') + ' @' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
        __showFatal();
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
        __log('promise: ' + ((e.reason && e.reason.message) || e.reason));
    });
    (function () {
        var orig = console.error;
        console.error = function () {
            try { __log('console.error: ' + Array.prototype.slice.call(arguments).map(String).join(' ').slice(0, 1500)); } catch (e) {}
            if (orig) orig.apply(console, arguments);
        };
    })();
    </script>

        input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: linear-gradient(to right, #8b5cf6 0%, #8b5cf6 var(--pct,50%), #e2e8f0 var(--pct,50%), #e2e8f0 100%); outline: none; width: 100%; }
